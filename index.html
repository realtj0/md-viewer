<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minimalistic Markdown Viewer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="favicon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
<meta name="description" content="Render markdown locally in your browser. No data leaves your device." />
<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<style>
  :root {
    --fg: #1a1a1a;
    --bg: #fafafa;
    --muted: #888;
    --border: #e5e5e5;
    --accent: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8;
      --bg: #111;
      --muted: #888;
      --border: #2a2a2a;
      --accent: #e8e8e8;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.6;
    min-height: 100vh;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 3rem 1.5rem 6rem;
  }
  .title {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.875rem;
    margin: 0.4rem 0 0;
  }
  .bar {
    display: flex;
    justify-content: center;
    padding: 1.5rem 0 0.5rem;
  }
  button {
    font: inherit;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 0.6rem 1.4rem;
    border-radius: 999px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  .filename {
    text-align: center;
    color: var(--muted);
    font-size: 0.875rem;
    margin-top: 0.5rem;
    min-height: 1.2em;
  }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0;
  }
  body.rendered .title,
  body.rendered .subtitle,
  body.rendered .hint,
  body.rendered .filename { display: none; }
  body.rendered main { padding-top: 0; }
  body.rendered .bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 0.6rem 0;
    margin: 0 -1.5rem;
    z-index: 5;
    border-bottom: 1px solid var(--border);
  }
  body.rendered #btn {
    padding: 0.35rem 0.9rem;
    font-size: 0.8rem;
  }
  body.rendered #out { margin-top: 1.5rem; }
  #out { margin-top: 1rem; }
  #out h1, #out h2, #out h3, #out h4, #out h5, #out h6 {
    line-height: 1.25;
    margin-top: 1.8em;
    margin-bottom: 0.6em;
  }
  #out h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  #out h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  #out p, #out ul, #out ol, #out blockquote { margin: 1em 0; }
  #out a { color: inherit; }
  #out code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--border);
    padding: 0.15em 0.35em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  #out pre {
    background: var(--border);
    padding: 1rem;
    border-radius: 6px;
    overflow-x: auto;
  }
  #out pre code { background: transparent; padding: 0; }
  #out blockquote {
    border-left: 3px solid var(--border);
    padding-left: 1rem;
    color: var(--muted);
  }
  #out img { max-width: 100%; height: auto; }
  #out table { border-collapse: collapse; width: 100%; }
  #out th, #out td { border: 1px solid var(--border); padding: 0.4em 0.7em; }
  #out hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  #drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
  }
  #drop-overlay.active { display: flex; }
  #drop-overlay > div {
    color: #fff;
    font-size: 1.25rem;
    padding: 2rem 3rem;
    border: 2px dashed rgba(255, 255, 255, 0.7);
    border-radius: 12px;
  }
</style>
</head>
<body>
<main>
  <h1 class="title">Minimalistic Markdown Viewer</h1>
  <p class="subtitle">Everything happens locally in your browser - no content is shared with this server - no data leaves your device</p>
  <div class="bar">
    <button id="btn" type="button">Pick .md file to render</button>
  </div>
  <p class="hint">…or drag &amp; drop a file anywhere on the page</p>
  <div class="filename" id="filename"></div>
  <article id="out"></article>
</main>
<input type="file" id="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
<div id="drop-overlay"><div>Drop your .md file</div></div>
<script>
  const btn = document.getElementById('btn');
  const file = document.getElementById('file');
  const out = document.getElementById('out');
  const fname = document.getElementById('filename');
  const overlay = document.getElementById('drop-overlay');

  marked.setOptions({ gfm: true, breaks: false });

  function renderText(text, name) {
    const html = marked.parse(text);
    out.innerHTML = DOMPurify.sanitize(html);
    fname.textContent = name;
    document.title = name + ' — MMV';
    document.body.classList.add('rendered');
    btn.textContent = 'Pick new .md file';
    window.scrollTo({ top: 0 });
  }

  function renderFile(f) {
    if (!f) return;
    const reader = new FileReader();
    reader.onload = e => renderText(e.target.result, f.name);
    reader.readAsText(f);
  }

  btn.addEventListener('click', () => file.click());

  file.addEventListener('change', () => {
    renderFile(file.files[0]);
    file.value = '';
  });

  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    e.preventDefault();
    if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
      dragDepth++;
      overlay.classList.add('active');
    }
  });
  window.addEventListener('dragover', e => { e.preventDefault(); });
  window.addEventListener('dragleave', e => {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) overlay.classList.remove('active');
  });
  window.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0;
    overlay.classList.remove('active');
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) renderFile(f);
  });

  if ('launchQueue' in window) {
    window.launchQueue.setConsumer(async launchParams => {
      if (!launchParams.files || !launchParams.files.length) return;
      try {
        const handle = launchParams.files[0];
        const file = await handle.getFile();
        const text = await file.text();
        renderText(text, file.name);
      } catch (err) {
        console.warn('launchQueue file read failed:', err);
      }
    });
  }

  const srcParam = new URLSearchParams(window.location.search).get('src');
  if (srcParam) {
    fetch(srcParam)
      .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(text => {
        const name = (() => {
          try { return new URL(srcParam, window.location.href).pathname.split('/').pop() || 'remote.md'; }
          catch { return 'remote.md'; }
        })();
        renderText(text, name);
      })
      .catch(err => console.warn('Failed to fetch ?src=:', err));
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
